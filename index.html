<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#112c2b">
<meta name="description" content="太微归鸿录：高武修仙世界的离线单机 RPG，独立场景准即时斗法，仙武同修，九境因果。">
<title>太微归鸿录 · 天人之约</title>
<style>
:root {
  --ink:#102826;
  --deep:#0b1a19;
  --panel:rgba(13,31,29,.96);
  --paper:#ece4cf;
  --muted:#a4b4a7;
  --gold:#d6b56e;
  --jade:#82bb9f;
  --line:rgba(204,195,156,.22);
  --red:#d88876;
  --serif:"Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",sans-serif
}
* {
  box-sizing:border-box
}
html,body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--deep);
  color:var(--paper);
  font:14px/1.6 var(--sans)
}
body {
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent
}
button,input,select {
  font:inherit
}
button {
  color:inherit;
  cursor:pointer;
  background:none;
  border:0
}
button:disabled {
  cursor:not-allowed;
  opacity:.38
}
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--gold);
  outline-offset:3px
}
input,select {
  color:var(--paper);
  background:#142f2c;
  border:1px solid var(--line);
  border-radius:3px;
  padding:10px 12px;
  max-width:100%
}
select option {
  background:var(--ink)
}
input[type=range] {
  accent-color:var(--jade);
  padding:0
}
a {
  color:var(--gold)
}
h1,h2,h3,h4,p {
  margin:0
}
h1,h2,h3 {
  font-family:var(--serif);
  font-weight:500
}
h2 {
  font-size:27px;
  letter-spacing:3px
}
h3 {
  font-size:20px;
  letter-spacing:1px
}
small {
  color:var(--muted)
}
strong {
  font-weight:600
}
svg {
  display:block
}
kbd {
  display:inline-block;
  padding:0 5px;
  border:1px solid var(--line);
  border-radius:3px;
  font:10px/18px var(--sans);
  color:var(--muted)
}
.hide {
  display:none!important
}
.muted {
  color:var(--muted)
}
.gold {
  color:var(--gold)
}
.jade {
  color:var(--jade)
}
.red {
  color:var(--red)
}
.tiny {
  font-size:11px;
  letter-spacing:1px
}
.eyebrow {
  font-size:11px;
  letter-spacing:4px;
  color:var(--gold);
  text-transform:uppercase
}
.serif {
  font-family:var(--serif)
}
.row {
  display:flex;
  align-items:center;
  gap:12px
}
.spread {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px
}
.stack {
  display:grid;
  gap:12px
}
.wrap {
  flex-wrap:wrap
}
.grow {
  flex:1;
  min-width:0
}
.divider {
  height:1px;
  background:var(--line);
  margin:18px 0
}
.btn {
  padding:10px 18px;
  min-height:42px;
  border:1px solid var(--line);
  border-radius:3px;
  background:rgba(180,185,150,.04);
  transition:background .15s,border-color .15s
}
.btn:hover:not(:disabled) {
  background:rgba(214,181,110,.11);
  border-color:var(--gold)
}
.btn.primary {
  background:var(--gold);
  color:#152522;
  border-color:var(--gold);
  font-weight:600
}
.btn.primary:hover {
  background:#e7c982
}
.btn.danger {
  border-color:#85594e;
  color:#eca38f
}
.btn.small {
  min-height:32px;
  padding:5px 11px;
  font-size:12px
}
.btn.wide {
  width:100%
}
.tag {
  display:inline-block;
  border:1px solid var(--line);
  padding:2px 8px;
  border-radius:2px;
  font-size:11px;
  color:var(--muted)
}
.tag.gold {
  color:var(--gold);
  border-color:rgba(214,181,110,.4)
}
.tag.jade {
  color:var(--jade)
}
.card {
  padding:18px;
  border:1px solid var(--line);
  background:rgba(116,143,118,.035);
  border-radius:3px
}
.card.active {
  border-color:var(--gold);
  background:rgba(214,181,110,.07)
}
.note {
  padding:13px 16px;
  border-left:2px solid var(--gold);
  background:rgba(214,181,110,.06);
  color:var(--muted);
  font-size:13px
}
.empty {
  padding:40px 20px;
  text-align:center;
  color:var(--muted)
}
.grid2 {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px
}
.grid3 {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px
}
.stat-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:1px;
  background:var(--line);
  border:1px solid var(--line)
}
.stat {
  background:#112a27;
  padding:13px 16px
}
.stat b {
  display:block;
  font-size:23px;
  font-weight:400;
  color:var(--paper)
}
.stat span {
  color:var(--muted);
  font-size:12px
}
.meter {
  height:5px;
  background:rgba(236,228,207,.1);
  position:relative;
  overflow:hidden
}
.meter>i {
  display:block;
  height:100%;
  background:var(--jade);
  width:0;
  transition:width .24s
}
.meter.hp>i {
  background:#b8a47a
}
.meter.mp>i {
  background:#76aead
}
.meter.xp>i {
  background:var(--gold)
}
.meter.energy>i {
  background:#8fba82
}
.tabs {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
  padding-bottom:13px;
  margin-bottom:20px
}
.tab {
  padding:7px 14px;
  border:1px solid transparent;
  color:var(--muted)
}
.tab.active {
  color:var(--gold);
  background:rgba(214,181,110,.08);
  border-color:var(--line)
}
.table {
  width:100%;
  border-collapse:collapse
}
.table td,.table th {
  padding:11px;
  text-align:left;
  border-bottom:1px solid var(--line)
}
.table th {
  color:var(--muted);
  font-weight:400;
  font-size:12px
}
.table tr.current {
  background:rgba(214,181,110,.1)
}
.icon {
  display:inline-grid;
  place-items:center;
  width:44px;
  height:44px;
  flex-shrink:0;
  border:1px solid var(--line);
  background:rgba(187,176,136,.06);
  color:var(--gold);
  font:23px var(--serif);
  border-radius:3px
}
.rarity2 {
  border-color:#7f92ad;
  color:#bbcce9
}
.rarity3 {
  border-color:#baa361;
  color:#e9d18c
}
#world {
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  touch-action:none
}
#veil {
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 110px 30px rgba(4,14,13,.22)
}
#hud {
  position:absolute;
  inset:0;
  pointer-events:none
}
#hud button,#hud nav,#hud .interactive {
  pointer-events:auto
}
.topbar {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:linear-gradient(#0b211ff2,#0b211fc7,transparent);
  gap:20px
}
.brand {
  font-family:var(--serif);
  font-size:24px;
  letter-spacing:4px;
  white-space:nowrap
}
.brand i {
  display:inline-block;
  color:var(--gold);
  font-size:11px;
  writing-mode:vertical-rl;
  letter-spacing:2px;
  border:1px solid var(--gold);
  font-style:normal;
  vertical-align:middle;
  margin-left:10px;
  padding:3px
}
.top-tools {
  display:flex;
  align-items:center;
  gap:18px;
  font-size:12px;
  color:#d5d6c4
}
.top-tools button {
  border:1px solid var(--line);
  padding:4px 11px;
  border-radius:3px
}
.clock {
  color:#d4c492
}
.hero-hud {
  position:absolute;
  top:91px;
  left:28px;
  width:228px;
  padding:17px 18px;
  background:linear-gradient(105deg,rgba(11,33,31,.91),rgba(11,33,31,.65));
  border:1px solid var(--line);
  border-radius:3px
}
.hero-name {
  font-family:var(--serif);
  font-size:23px;
  letter-spacing:3px
}
.hero-line {
  margin-top:10px
}
.hero-line .spread {
  font-size:10px;
  margin-bottom:4px
}
.hero-line .spread span {
  letter-spacing:2px;
  color:var(--muted)
}
.hero-line .spread b {
  font-weight:400;
  font-variant-numeric:tabular-nums
}
.hud-resources {
  border-top:1px solid var(--line);
  margin-top:13px;
  padding-top:9px;
  font-size:12px
}
.objective {
  position:absolute;
  left:28px;
  top:340px;
  width:228px;
  background:linear-gradient(100deg,rgba(13,35,32,.89),rgba(13,35,32,.57));
  padding:15px 17px;
  border-left:2px solid var(--gold)
}
.objective h3 {
  font-size:16px;
  margin:5px 0
}
.objective p {
  font-size:12px;
  line-height:1.8;
  color:#bdc7b8
}
.objective button {
  padding:0;
  margin-top:10px;
  color:var(--gold);
  font-size:12px
}
.objective .steps {
  letter-spacing:3px;
  font-size:10px;
  color:var(--muted)
}
.map-hud {
  position:absolute;
  right:28px;
  top:91px;
  width:194px;
  border:1px solid var(--line);
  background:rgba(12,33,30,.82);
  padding:12px;
  pointer-events:auto;
  border-radius:3px
}
.map-hud h3 {
  font-size:18px;
  letter-spacing:3px
}
.map-hud small {
  font-size:10px;
  letter-spacing:2px
}
.map-hud canvas {
  display:block;
  width:168px;
  height:134px;
  margin:8px auto 4px
}
.map-hud .row {
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding-top:7px
}
.world-tip {
  position:absolute;
  right:28px;
  top:347px;
  width:194px;
  color:#dbdfce;
  font-size:11px;
  text-align:center;
  text-shadow:0 1px 4px #001
}
.bottom {
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:stretch;
  gap:1px;
  background:rgba(10,28,26,.94);
  border:1px solid var(--line);
  padding:6px;
  border-radius:4px;
  box-shadow:0 10px 40px #0004
}
.navbtn {
  min-width:71px;
  padding:7px 11px 5px;
  text-align:center;
  position:relative;
  transition:background .15s
}
.navbtn:hover {
  background:#b8b08718
}
.navbtn .navicon {
  font-family:var(--serif);
  display:block;
  font-size:24px;
  line-height:29px;
  color:#d4c18f
}
.navbtn>span {
  font-size:11px;
  color:var(--muted);
  letter-spacing:2px
}
.navbtn kbd {
  position:absolute;
  right:4px;
  top:1px;
  border:0;
  font-size:9px
}
.log-hud {
  position:absolute;
  bottom:120px;
  left:28px;
  width:300px;
  max-height:120px;
  overflow:hidden;
  font-size:11px;
  color:#dce0cf;
  text-shadow:0 1px 3px #001;
  mask-image:linear-gradient(transparent,#000 24%)
}
.log-hud p {
  padding:3px 0
}
.log-hud b {
  font-weight:400;
  color:#e0c788;
  margin-right:7px
}
.interact-hint {
  position:absolute;
  left:50%;
  bottom:127px;
  transform:translateX(-50%);
  background:#0d2522e8;
  border:1px solid var(--line);
  padding:9px 19px;
  border-radius:3px;
  max-width:70%;
  text-align:center;
  font-size:12px;
  white-space:nowrap
}
.interact-hint kbd {
  margin-right:8px;
  color:var(--gold)
}
.location-toast {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s;
  text-shadow:0 2px 8px #001
}
.location-toast.show {
  opacity:1
}
.location-toast h2 {
  font-size:42px;
  letter-spacing:14px;
  color:#e7e0c6
}
.location-toast p {
  font-size:12px;
  letter-spacing:3px;
  margin-top:7px;
  color:#d1d9c3
}
.auto-route {
  position:absolute;
  top:76px;
  left:50%;
  transform:translateX(-50%);
  background:#0c2623e8;
  border:1px solid var(--line);
  padding:6px 15px;
  font-size:12px;
  color:var(--gold);
  pointer-events:auto
}
.mobile-controls {
  display:none
}
.joystick {
  width:112px;
  height:112px;
  border-radius:50%;
  border:1px solid #ded8bd50;
  background:#122e2855;
  touch-action:none;
  position:absolute;
  bottom:110px;
  left:24px;
  pointer-events:auto
}
.joystick:before {
  content:"";
  position:absolute;
  inset:20px;
  border:1px solid #ded8bd20;
  border-radius:50%
}
.stick {
  position:absolute;
  left:36px;
  top:36px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e0d8b340;
  border:1px solid #e0d8b37a
}
.touch-interact {
  position:absolute;
  bottom:137px;
  right:24px;
  border:1px solid #d6b56e88;
  background:#18382ae8;
  border-radius:50%;
  width:68px;
  height:68px;
  font-family:var(--serif);
  font-size:23px;
  pointer-events:auto
}
#title-screen {
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(7,25,24,.96),rgba(9,30,27,.66) 42%,rgba(6,22,22,.02) 77%);
  display:flex;
  align-items:center;
  padding:65px 8vw
}
.title-body {
  position:relative;
  max-width:540px
}
.title-rule {
  height:1px;
  width:70px;
  background:var(--gold);
  margin-bottom:24px
}
.title-main {
  font-size:clamp(48px,6.8vw,99px);
  letter-spacing:12px;
  line-height:1.3;
  white-space:nowrap;
  color:#ede7d1;
  text-shadow:0 4px 32px #0003
}
.title-sub {
  display:flex;
  align-items:center;
  gap:18px;
  margin:19px 0 25px
}
.title-sub span {
  font-family:var(--serif);
  font-size:29px;
  letter-spacing:10px;
  color:var(--gold)
}
.seal {
  display:inline-block;
  width:32px;
  height:35px;
  line-height:15px;
  padding:2px;
  border:1px solid #b26b57;
  color:#d49680;
  font-family:var(--serif);
  font-size:12px;
  text-align:center;
  transform:rotate(-5deg)
}
.title-copy {
  color:#b4c2b4;
  font-family:var(--serif);
  font-size:16px;
  letter-spacing:3px;
  line-height:2.2
}
.title-actions {
  margin-top:40px;
  width:290px;
  display:grid;
  gap:12px
}
.title-actions .btn {
  min-height:48px;
  letter-spacing:5px;
  font-size:15px
}
.title-links {
  margin-top:18px;
  display:flex;
  gap:25px;
  color:var(--muted);
  font-size:12px
}
.title-bottom {
  position:absolute;
  bottom:27px;
  left:8vw;
  right:6vw;
  display:flex;
  justify-content:space-between;
  color:#94ad9d;
  font-size:10px;
  letter-spacing:3px
}
.title-verse {
  position:absolute;
  right:7vw;
  top:20vh;
  writing-mode:vertical-rl;
  font-family:var(--serif);
  font-size:15px;
  letter-spacing:7px;
  color:#c9d1b79e;
  line-height:2.6
}
.title-badge {
  position:absolute;
  right:6vw;
  bottom:18vh;
  color:#d3c79c;
  writing-mode:vertical-rl;
  letter-spacing:5px;
  font:12px var(--serif)
}
#modal-root {
  position:absolute;
  inset:0;
  background:rgba(3,15,13,.69);
  backdrop-filter:blur(5px);
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 20px
}
.modal {
  width:min(960px,94vw);
  max-height:90vh;
  display:flex;
  flex-direction:column;
  border:1px solid rgba(208,190,143,.4);
  background:var(--panel);
  box-shadow:0 30px 100px #0007;
  border-radius:4px;
  position:relative
}
.modal.narrow {
  width:min(620px,94vw)
}
.modal.large {
  width:min(1130px,96vw)
}
.modal-head {
  padding:23px 28px 19px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-shrink:0
}
.modal-head .eyebrow {
  margin-bottom:3px
}
.close {
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  font-size:23px;
  font-weight:200;
  color:var(--muted)
}
.modal-content {
  padding:25px 28px;
  overflow:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:#6b806d transparent
}
.modal-foot {
  padding:12px 28px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--muted)
}
.portrait {
  width:110px;
  height:130px;
  flex-shrink:0;
  background:radial-gradient(ellipse at bottom,#40604466,transparent 80%);
  border:1px solid var(--line);
  position:relative;
  overflow:hidden
}
.portrait canvas {
  width:100%;
  height:100%
}
.dialogue {
  display:flex;
  align-items:flex-start;
  gap:24px
}
.dialogue-copy {
  font-family:var(--serif);
  line-height:2.1;
  font-size:17px;
  margin:10px 0 20px;
  color:#dddcca
}
.choices {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px
}
.choice {
  padding:13px 15px;
  text-align:left;
  border:1px solid var(--line);
  background:#789b8020;
  border-radius:3px;
  color:#e4dcc5
}
.choice:hover {
  border-color:var(--gold);
  background:#8c987932
}
.choice small {
  display:block;
  font-size:11px;
  margin-top:2px
}
.choice.primary {
  border-color:#bbac6870;
  color:var(--gold)
}
.quest-entry {
  border:1px solid var(--line);
  padding:16px;
  margin-top:12px
}
.quest-entry .row {
  margin-top:8px
}
.quest-entry p {
  color:var(--muted);
  font-size:12px;
  margin-top:8px
}
.quest-entry.ready {
  border-color:#93b98766
}
.item-card {
  display:flex;
  align-items:flex-start;
  gap:13px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:3px;
  min-height:142px
}
.item-card h4 {
  font-size:15px;
  font-weight:500
}
.item-card p {
  font-size:12px;
  color:var(--muted);
  margin:5px 0 9px
}
.item-actions {
  display:flex;
  flex-wrap:wrap;
  gap:6px
}
.character-art {
  min-height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:radial-gradient(ellipse at center,#65836833,transparent 68%);
  border:1px solid var(--line)
}
.character-art canvas {
  width:180px;
  height:260px
}
.character-art .circle {
  position:absolute;
  width:210px;
  height:210px;
  border-radius:50%;
  border:1px solid #d5bc7540
}
.character-layout {
  display:grid;
  grid-template-columns:240px 1fr;
  gap:22px
}
.equipment-slot {
  padding:12px;
  border:1px solid var(--line);
  display:flex;
  align-items:center;

  gap:8px;

.x-daobtn .navicon{color:#edcf8c!important}
body.taiwei #title-screen{background:linear-gradient(90deg,#071a18f7,#0c251ddb 27%,#112a1e42 56%,transparent 81%);padding-left:8vw}
body.taiwei .title-main{font-family:"STKaiti","KaiTi","Songti SC",serif;font-size:clamp(48px,6.8vw,100px);letter-spacing:7px;text-shadow:0 6px 30px #071a1677;line-height:1.45;color:#f1e5c7}
body.taiwei .title-sub span{letter-spacing:12px;color:#d9bf80;font-size:26px}
body.taiwei .title-copy{font-family:"STKaiti","KaiTi",serif;color:#bfceb7;line-height:2.05;font-size:18px;letter-spacing:3px}
.x-title-detail{display:inline-block;font:11px/1.8 "Microsoft YaHei",sans-serif;letter-spacing:3px;color:#aebca4;margin-top:16px;border-top:1px solid #d7c1853d;padding-top:12px}
body.taiwei .title-actions{margin-top:26px;width:300px}
body.taiwei .title-actions .btn{background:#2143349e;border-color:#b5a87370;box-shadow:inset 0 0 20px #76915111}
body.taiwei .title-actions .btn.primary{background:linear-gradient(120deg,#d2bc86,#a98d56);color:#1e3025}
body.taiwei .title-rule{width:98px;background:linear-gradient(90deg,#e4cb90,transparent);margin-bottom:13px}
body.taiwei .title-verse{line-height:2.8;color:#d0d5b898;right:6vw}
.x-creation{display:grid;gap:13px;margin-top:8px}
.x-sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:25px 0 13px;padding-bottom:10px;border-bottom:1px solid var(--x-line)}
.x-sectionhead h3{font:21px "STKaiti","KaiTi",serif;letter-spacing:2px;color:#e1d5b5}
.x-sectionhead small{font-size:11px;letter-spacing:.3px;color:#9eb19b}
.x-creation .x-sectionhead{margin:0}
.x-rootpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.x-root{display:grid;gap:5px;text-align:center;place-items:center;border:1px solid #acb19133;background:#81926a08;padding:9px 4px;min-height:115px;border-radius:3px}
.x-root span{font:28px "STKaiti","KaiTi",serif;border:1px solid currentColor;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;background:#10261f;box-shadow:inset 0 0 14px #aac6b00a}
.x-root b{font:13px "STKaiti","KaiTi",serif;color:#ddd6bb}
.x-root small{font-size:9px;line-height:1.6}
.x-root.active{background:#aac79817;border-color:#d1b679;box-shadow:inset 0 -2px #a88c57}
.x-root:hover{border-color:#c9c69a}
.x-seedrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.x-seedrow input{flex:1;min-width:110px;padding:7px 10px}
.x-seedrow small{flex:0 0 100%;font-size:10px}
.x-modal .modal-content{padding-top:14px}
.x-tabs{display:flex;gap:3px;border-bottom:1px solid var(--x-line);padding-bottom:9px;margin:0 0 24px;overflow-x:auto;scrollbar-width:thin}
.x-tab{white-space:nowrap;padding:8px 16px;color:#9eaf9b;font:15px "STKaiti","KaiTi",serif;letter-spacing:2px;border:1px solid transparent;border-radius:2px}
.x-tab:hover{color:#e5cf94;background:#7b916820}
.x-tab.active{color:#e6cb8b;border-color:#c4ad704f;background:linear-gradient(#b6a16b1a,#7f9c6518);box-shadow:inset 0 -2px #c4a46780}
.x-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.x-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.x-card{border:1px solid var(--x-line);padding:18px;background:linear-gradient(140deg,#b4c59407,transparent);position:relative;border-radius:3px;min-width:0}
.x-card h3{font:20px/1.5 "STKaiti","KaiTi","Songti SC",serif;letter-spacing:1px;color:#e3d8b9;margin:6px 0}
.x-card h3 small{font:11px sans-serif;color:#a2b399}
.x-card p{font-size:12px;line-height:1.9;color:#aebda6;margin:8px 0 12px}
.x-card .row{gap:7px}
.x-card .btn{font-size:11px;padding:6px 10px;min-height:30px}
.x-card.active{border-color:#cdb77b80;box-shadow:inset 0 0 30px #c4bc6409;background:linear-gradient(120deg,#b7b27a10,transparent)}
.x-card.locked{filter:saturate(.55);opacity:.7}
.x-card.locked button{opacity:.6}
.x-notice{padding:14px 17px;background:linear-gradient(90deg,#baa66713,transparent);border-left:2px solid #bcaa73;color:#b7c3ad;font-size:12px;line-height:1.9;margin-bottom:16px}
.x-notice.gold{color:#e1c88e}
.x-notice .btn{margin-left:9px}
.x-small{font-size:11px;color:#9eaf97}
.x-muted{color:#9baa94;font-size:12px}
.x-symbol{display:grid;place-items:center;width:47px;height:47px;border:1px solid #c4b47770;background:radial-gradient(#98ae7322,#122c23);border-radius:50%;color:#d1c48a;font:27px "STKaiti","KaiTi",serif;box-shadow:0 0 0 4px #bda76808;margin-bottom:13px}
.x-metrics{display:flex;flex-wrap:wrap;gap:1px;background:#acb18326;border:1px solid #b4b58333;margin:18px 0}
.x-metrics>div{flex:1;min-width:105px;padding:15px 18px;background:#173128}
.x-metrics small{display:block;letter-spacing:1px;font-size:10px;color:#acb9a0}
.x-metrics b{font:26px/1.6 "STKaiti","KaiTi",serif;display:block;color:#ddce9d;font-variant-numeric:tabular-nums}
.x-hero{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:center;padding:22px 26px;background:radial-gradient(ellipse at 20% 40%,#6c8b5326,transparent 55%);border:1px solid var(--x-line);margin-bottom:20px}
.x-hero h3{font-size:28px;letter-spacing:4px}
.x-hero p{font-size:13px;line-height:1.9;color:#b7c2aa;margin:10px 0}
.x-realm-ring{position:relative;min-height:200px;display:grid;place-items:center;text-align:center}
.x-realm-ring svg{width:200px;height:200px}
.x-realm-ring .x-realm-name{position:absolute;inset:0;display:grid;place-content:center;font:33px "STKaiti","KaiTi",serif;color:#e0cb90;letter-spacing:6px}
.x-realm-ring small{display:block;font:11px/2 sans-serif;letter-spacing:2px}
.x-chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.x-chapter{border:1px solid var(--x-line);padding:16px;min-width:0;background:#a5b38a04}
.x-chapter.current{border-color:#d6c18480;background:#b5b16c13}
.x-chapter.done{border-left:3px solid #89b194}
.x-chapter h3{font:19px "STKaiti","KaiTi",serif;letter-spacing:1px;margin:6px 0}
.x-chapter p{font-size:11px;color:#aebca3;line-height:1.85}
.x-chapter small{font-size:10px;color:#9eaf96}
.x-inline-nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.x-skill-header{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.x-skill-glyph{width:43px;height:43px;display:grid;place-items:center;font:26px "STKaiti","KaiTi",serif;border:1px solid currentColor;border-radius:50%}
.x-loadout{display:flex;flex-wrap:wrap;gap:8px;padding:15px;border:1px solid var(--x-line);background:#889e7010;margin-bottom:20px}
.x-loadout .btn{flex:1;min-width:135px}
.x-recipe-cost{font-size:11px;line-height:1.9;color:#c6b785;margin:10px 0}
.x-artifact-hero{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center;padding:25px;border:1px solid var(--x-line);margin-bottom:18px}
.x-artifact-art{height:240px;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse,#8fab7433,transparent 65%)}
.x-artifact-art svg{width:220px;height:220px}
.x-artifact-art:before{content:"";position:absolute;inset:28px;border:1px solid #c9c19544;border-radius:50%}
.x-artifact-art:after{content:"";position:absolute;inset:13px;border:1px dashed #afbd9140;border-radius:50%}
.x-garden{text-align:center;padding:22px}
.x-garden .x-symbol{margin:0 auto 10px;width:63px;height:63px;font-size:34px;background:radial-gradient(#84a05d22,#203d29)}
.x-star-map{border:1px solid #acbb8533;background:radial-gradient(ellipse,#3f614120,#102b22);border-radius:2px;overflow:hidden}
.x-star-map svg{width:100%;height:auto;display:block;max-height:510px}
.x-mapnode{cursor:pointer;outline:0}
.x-mapnode:hover circle:first-child,.x-mapnode:focus circle:first-child{stroke:#f0d68e;stroke-width:3}
.x-mapnode.locked{opacity:.5}
.x-records{display:grid;gap:0}
.x-record{display:grid;grid-template-columns:90px 70px 1fr;gap:13px;padding:15px 5px;border-bottom:1px solid #bbc09b18;align-items:baseline}
.x-record span{color:#879d88;font-size:10px}
.x-record b{color:#c2bc85;font-size:11px;font-weight:500}
.x-record p{font-size:12px;line-height:1.9;color:#bcc7af}
.x-dialog-seal{width:98px;height:115px;flex-shrink:0;border:1px solid #b9ad7077;background:radial-gradient(ellipse,#82986935,#1d3e2e);color:#dec991;display:grid;place-items:center;font:53px "STKaiti","KaiTi",serif}
.x-help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.x-help-grid section{padding:17px;border:1px solid var(--x-line)}
.x-help-grid h3{color:#d3c187;font:23px "STKaiti","KaiTi",serif;margin-bottom:12px}
.x-help-grid p{color:#b3c3ac;font-size:12px;line-height:2;margin:8px 0}
.x-battle-result .x-metrics{margin-top:0}
/* New combat HUD intentionally does not reuse any round-based layout. */
#battle-ui{background:linear-gradient(#061916bb,transparent 32%,transparent 57%,#071914ee 87%);pointer-events:none}
#battle-ui .rt-top{position:absolute;top:25px;left:50%;transform:translateX(-50%);width:min(960px,85vw);text-align:center}
.rt-heading{display:flex;gap:16px;justify-content:center;align-items:baseline;margin-bottom:14px}
.rt-heading h2{font:25px "STKaiti","KaiTi","Songti SC",serif;letter-spacing:4px;color:#e5d6b1}
.rt-heading .eyebrow{font-size:10px;letter-spacing:3px}
.rt-time{font-size:12px;letter-spacing:1px;color:#d4c591;font-variant-numeric:tabular-nums}
.rt-enemies{display:flex;gap:13px;justify-content:center;align-items:stretch}
.rt-enemy{min-width:185px;max-width:265px;flex:1;background:linear-gradient(125deg,#1b372cf2,#0b231eee);border:1px solid #91a08152;padding:11px 14px;text-align:left;border-radius:3px;position:relative;box-shadow:0 9px 25px #0002}
.rt-enemy.selected{border-color:#dcc78caa;background:linear-gradient(125deg,#354530ef,#11281fee);box-shadow:0 0 23px #cdb76d0a}
.rt-enemy.dead{opacity:.35}
.rt-enemy strong{font:17px "STKaiti","KaiTi",serif;letter-spacing:2px;color:#e0d8bc}
.rt-enemy .spread{gap:6px}
.rt-el{display:inline-grid;place-items:center;width:23px;height:23px;border:1px solid currentColor;border-radius:50%;font:14px "STKaiti","KaiTi",serif;flex-shrink:0;background:#152921}
.rt-small{display:flex;justify-content:space-between;gap:5px;font-size:10px;color:#adbaa3;font-variant-numeric:tabular-nums;margin:4px 0}
.rt-meter{height:5px;background:#091b16b8;position:relative;margin:8px 0 4px;overflow:hidden;border:1px solid #c1b58a22}
.rt-meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#779663,#c3c18a);transition:width .12s linear}
.rt-meter.hp>i{background:linear-gradient(90deg,#837247,#ceb889)}
.rt-meter.mp>i{background:linear-gradient(90deg,#427c7d,#8cc2c2)}
.rt-meter.posture{height:3px;margin:6px 0}
.rt-meter.posture>i{background:linear-gradient(90deg,#735c36,#e1b35f)}
.rt-intent{height:19px;font-size:10px;position:relative;overflow:hidden;color:#d5ba81;line-height:19px}
.rt-intent>span{position:relative;z-index:1}
.rt-intent>i{position:absolute;left:0;top:0;bottom:0;background:#dcac5624;border-right:1px solid #d6b978;z-index:0}
.rt-rule{font-size:11px;color:#b5c3a9;line-height:1.65;letter-spacing:.5px;margin:10px auto 0;text-shadow:0 1px 4px #001}
.rt-side{position:absolute;right:20px;top:26px;display:grid;gap:7px;width:116px}
.rt-side button{font-size:10px;min-height:31px;padding:5px 8px;border:1px solid #b7b18444;background:#152e25d9;color:#c9c5a0}
.rt-side button.active{border-color:#9fbe9877;color:#bad4ae}
.rt-side .rt-flee{color:#aeb9a1}
.rt-pause{position:absolute;left:50%;top:31%;transform:translateX(-50%);pointer-events:auto;padding:11px 25px;text-align:center;background:linear-gradient(110deg,#ddd0a6ed,#c0b184e8);border:1px solid #e2d5ac;color:#21352a;box-shadow:0 12px 40px #03130d70;min-width:320px;border-radius:2px}
.rt-pause strong{font:22px "STKaiti","KaiTi",serif;display:block;letter-spacing:5px}
.rt-pause small{color:#526147;display:block;font-size:11px;margin-top:4px}
.rt-pause .btn{background:#284532;margin-top:8px;color:#e5dbb5;border:1px solid #8b9c73;font-size:11px;padding:4px 14px;min-height:27px}
.rt-bottom{position:absolute;left:50%;bottom:21px;transform:translateX(-50%);width:min(1130px,94vw);pointer-events:auto}
.rt-status{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:12px}
.rt-player{width:330px;flex:0 1 38%;min-width:230px}
.rt-player h3{font:23px "STKaiti","KaiTi",serif;letter-spacing:3px;margin-bottom:7px;color:#ebdeb9}
.rt-player .rt-meter{height:7px;margin-top:5px;border-radius:1px}
.rt-player .rt-meter.shield{height:3px;margin-top:3px}
.rt-player .rt-meter.shield>i{background:#d4c683}
.rt-player .rt-small{color:#c4caae;font-size:11px}
#rt-castline{height:22px;position:relative;margin-top:5px;border-bottom:1px solid #b3b5822e;font-size:10px;line-height:20px;color:#bcc8a8}
#rt-castline>span{z-index:1;position:relative}
#rt-castline>i{position:absolute;bottom:-1px;left:0;height:2px;background:#bcb674;display:block;max-width:100%}
#rt-statuschips{font-size:10px;margin:4px 0 0;min-height:5px}
.rt-log{font-size:11px;line-height:1.8;color:#bfccb2;max-width:50%;text-align:right;max-height:78px;overflow:hidden;text-shadow:0 1px 3px #000}
.rt-log p{margin:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.rt-actions{display:flex;gap:7px;align-items:stretch;padding:9px;background:linear-gradient(90deg,#16372cef,#112b24ef);border:1px solid #b3a7725f;box-shadow:0 12px 36px #0005;border-radius:3px 9px 3px 3px}
.rt-skill,.rt-action{position:relative;flex:1;min-width:0;min-height:93px;border:1px solid #8292785e;background:linear-gradient(145deg,#45594324,#10271eea);padding:7px 4px 5px;overflow:hidden;text-align:center;border-radius:2px}
.rt-skill{flex:1.32;border-color:color-mix(in srgb,var(--el,#b5c49a) 50%,transparent)}
.rt-skill strong,.rt-action strong{display:block;font:16px "STKaiti","KaiTi",serif;color:#e6dab8;line-height:1.6;white-space:nowrap}
.rt-skill small,.rt-action small{display:block;font-size:9px;color:#a8bb9f;white-space:nowrap}
.rt-skill kbd,.rt-action kbd{position:absolute;left:5px;top:4px;padding:0;border:none;font:9px sans-serif;color:#d1c798}
.rt-glyph{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--el,#bdc093);border-radius:50%;background:radial-gradient(#b9c69e19,transparent);color:var(--el,#d2c184);font:23px "STKaiti","KaiTi",serif;margin:0 auto 3px;box-shadow:0 0 12px #b6bc7811}
.rt-action .rt-glyph{font-size:21px;width:31px;height:31px;margin:3px auto 4px}
.rt-skill.unready{filter:saturate(.5)}
.rt-action.unready{opacity:.64}
.rt-skill:hover,.rt-action:hover{border-color:#e8d193;background:linear-gradient(145deg,#8b965637,#1c392aed)}
.rt-skill:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#030e09aa var(--cool,0%),transparent var(--cool,0%));pointer-events:none}
.rt-cd{z-index:2;position:absolute;inset:15px 0 auto;text-align:center;line-height:38px;color:#f2e5bc;font-size:22px;font-family:serif;text-shadow:0 1px 5px #000;pointer-events:none}
.rt-action.ready{border-color:#e0c97b;box-shadow:inset 0 0 22px #b7a9553d,0 0 12px #b0a36223}
.rt-action.ready .rt-glyph{color:#f4d78c}
.rt-skill.empty{opacity:.48;display:grid;place-content:center}
.rt-footer{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#859e87;line-height:1.8;margin-top:7px;padding:0 6px}
.rt-sub{padding:14px;background:#102a22f5;border:1px solid #bea97280;max-height:220px;overflow:auto;margin-bottom:12px;box-shadow:0 -10px 50px #03140f50}
.rt-sub h3{font-size:17px;margin-bottom:9px}
.rt-sub .row{gap:7px}
.rt-sub .btn{font-size:11px;min-width:135px;min-height:40px;padding:7px 11px}
.in-battle #hud{display:none!important}
.in-battle #toasts{top:225px;right:18px;max-width:290px}
.in-battle .toast{font-size:11px}
.rt-touch-move{display:none}

        "text": "掌柜送给小禾两袋种子。一袋口上系着红绳，另一袋系着蓝绳。小禾把红绳袋的种子播在向阳的地里，把蓝绳袋的放进木盒留待来年。过了十天，地里冒出了嫩芽；木盒里的种子还是原来的样子。",
        "source": "本版原创"
      },
      "g4_umbrella": {
        "title": "共一把伞",
        "text": "傍晚，私塾放学，雨又下起来了。小满只有一把伞，便招呼没有带伞的同桌一起走。一路上，他把伞朝同桌那边斜了斜。到家时，母亲看见他的左肩湿了，小满却笑着说：“我们都平安到家了。”",
        "source": "本版原创"
      },
      "g4_basket": {
        "title": "竹篮里的纸条",
        "text": "阿远去给祖母送桃子。竹篮上盖着一块蓝布，布下面压着纸条：“桃子六个，其中一个有碰伤，请先吃。”路上，阿远又从自家树下拾起一个完好的桃子放进篮里。他想了想，把纸条上的“六”改成“七”，其余字没有改。",
        "source": "本版原创"
      },
      "g4_bell": {
        "title": "清晨的铃声",
        "text": "老船夫每天清晨摇三下铜铃，提醒乘客上船。有一天，浓雾把河面遮住了。他只摇了一下铃，就挂出“雾散再渡”的木牌。赶集的人见了木牌，把行李放下，在岸边等候。直到对岸的柳树看得清楚了，船夫才再次摇铃。",
        "source": "本版原创"
      },
      "g6_ferry": {
        "title": "留在岸上的灯",
        "text": "暴雨过后，渡口的旧灯架歪了。几名年轻人提议拆掉它，换成更高、更亮的新灯。老船夫没有反对，只请他们把旧灯暂时留在岸边。那夜，一位常来渡河的盲眼货郎到了。他说，旧灯架上松动的铜片一响，就知道该在哪里停步。第二天，年轻人在新灯架上添了一枚风铃，并把铃声的位置调到与旧铜片相同的地方。",
        "source": "本版原创"
      },
      "g6_cargo": {
        "title": "迟到的镖箱",
        "text": "镖队约定日落前把药箱送到镇口。半路桥塌了，镖头决定改走山路，并让轻骑先去药铺报信。众人到达时，天已经黑了。掌柜看见箱封完好，却仍皱着眉。轻骑拿出午后送达的改道通知，掌柜才松了口气：“病人已经按消息安排了别的药，不必空等。”镖头把迟到原因与实际到达时间一并写入回单，没有划掉原定时辰。",
        "source": "本版原创"
      },
      "g6_well": {
        "title": "井边的两张表",
        "text": "村里要比较两口井哪口水更清。甲井记录表只写了晴天早晨的情况，乙井表却包含雨后午后的记录。阿蘅没有立即下结论。她建议连续五天，在同一时刻、用同样的清洁木桶取水，放在同样的白瓷碗里观察。五天后，两组人把结果和天气一同公布，并说明：这些记录只能反映这五天的观察，不能证明饮用一定安全。",
        "source": "本版原创"
      },
      "g6_cloth": {
        "title": "没绣完的花",
        "text": "母亲给远行的女儿缝衣，袖口还差一朵花。听见院外有人喊失火，她放下针，提起水桶就跑。火灭后，衣袖上落了几点烟灰。女儿说不要洗去，母亲却笑道：“灰要洗，没绣完的花慢慢补。帮人不是为了把痕迹留给人看。”后来女儿遇到困顿的旅人，也先伸手帮忙，再继续赶路。",
        "source": "本版原创"
      },
      "g6_store": {
        "title": "书架的新规矩",
        "text": "书局曾按书的颜色排架，看起来整齐，读者却常找不到书。小伙计建议按用途分成识字、游记、技艺三类，每类再放一张索引。掌柜试行一月，记录了问路次数与找书所用时间。两项都减少后，他保留了新办法，但另设一格“暂未归类”，等弄清内容再放回相应书架。",
        "source": "本版原创"
      },
      "g8_roof": {
        "title": "瓦上的名字",
        "text": "镇里修书院，捐资者争着把名字刻上新瓦。木匠周伯迟迟没有交出自己的那片。问起时，他指着换下来的朽梁说：“瓦片看得见，梁藏在下面。若只修看得见的，下一场雨还是要漏。”有人笑他不懂体面。他没有争辩，拿着烛火逐根检查旧梁，并把查出的裂缝画在纸上。书院落成时，门前的功德碑很热闹，周伯却在后窗试一扇不易开启的窗。",
        "source": "本版原创"
      },
      "g8_record": {
        "title": "一份未写完的案卷",
        "text": "仓库失火，卷宗初稿写：“守仓人饮酒，故引发火灾。”复查者发现，饮酒有两名证人证明，但火源尚不明；同日另有雷击记录，仓后还堆着易燃杂物。他把句子改成：“守仓人当晚饮酒；失火原因仍待核查。”有人嫌这样不够痛快。他答道：“该追究的失职不能放过，尚未证实的因果也不能硬写进去。”",
        "source": "本版原创"
      },
      "g8_paper": {
        "title": "纸灯与石灯",
        "text": "关于渡口照明，两份方案同时送来。纸灯每盏制作快、耗材少，但遇风雨需收起；石灯初建费工，固定后较稳，却不便挪动。镇中主街地势开阔，常年使用；临时夜市只有三晚，摊位每夜调整。议事者没有评出一种“永远最好”的灯，而是给主街选石灯，给有棚的夜市配可移动纸灯，并保留风雨停市的安排。",
        "source": "本版原创"
      },
      "g8_wenyan": {
        "title": "守桥小记",
        "text": "某县桥圮，众欲急渡。吏曰：“水方盛，舟小而载重，未可行也。”一客怒，促之。吏不应，先遣人察上流，乃减载而渡。客既济，始谢曰：“向者但知求速，不知有险。”\n【注】圮：倒塌。方：正。促：催促。既济：已经渡过。向者：刚才。",
        "source": "本版原创"
      },
      "g8_snow": {
        "title": "雪中的空椅",
        "text": "客栈堂前总摆两把椅子。一把给掌柜，一把留给常来讲书的老人。入冬后，老人病了，很久没有来。伙计说空椅碍路，掌柜便把两把椅子一起挪到墙边，却没有收进库房。大雪那天，一名孩子来送药方，指着空椅问：“爷爷回来还坐这里吗？”掌柜拂去椅面上并不存在的灰，说：“当然。”窗外脚印很快被雪盖住，堂里两把椅子靠得更近了。",
        "source": "本版原创"
      }
    },

   可选实现：

     hit(self,e,ctx)             伤害结算后触发（焚根、碎丹、断链、锁定伤口）
     plan(self,e)                返回 {intent,shape,radius,windup,power} 覆盖本次意图
     tick(self,e,dt)             每帧（元素轮转、枯竹、回溯、共生、封印）

 5:{ /* 空蝉母 · 啮时妖祖：主相每六息轮转且显露被克弱点；每三息回溯三成伤口 */
  damage(self,e,ctx,element){

        async importSave(file) {
            if (!file)

                return this.toast('存档文件过大。', 'bad');
            try {

                this.store.validate(e);
                if (this.loadEnvelope(e))
                    this.store.save('auto', true);
            }
            catch (err) {
                this.toast('导入失败：' + err.message + '，当前进度未被修改。', 'bad');

        showHelp() {
            this.showModal('行走指南', `<div class="grid2"><div class="card"><h3>怎么走，怎么问</h3><div class="divider"></div><p class="muted">WASD / 方向键：连续移动。Shift：疾行。点击地面：自动绕障；点击人物：走近交互。E（可改键）或空格：与最近对象交互。Esc：关闭菜单或打开系统。</p><p class="muted" style="margin-top:12px">触屏使用左侧摇杆、点击地面与右侧“交互”按钮。地图的“循路前往”会步行穿过多个区域、自动进出建筑并追踪移动目标，随时可停止。内部寻路仅用于避障，人物没有格点锁定。</p><div class="divider"></div><p class="muted">快捷键：C 人物、B 行囊、K 武学、J 见闻、F 门派、M 地图、R 打坐、L 人物志、T 听风楼、U 科举、V 音效静音、F5 快速写入手动一档。战斗中 1–6 对应指令。</p></div><div class="card"><h3>第一段江湖</h3><div class="divider"></div><p class="muted">先与母亲、村长交谈。教头传你长拳、吐纳法与草上飞，接着打一次木人。交付任意一件新手委托后，回村长处取出镇许可。</p><p class="muted" style="margin-top:12px">最快的第一件委托是母亲的“一碗安心药”：初始行囊已有金创药，接下后即可交付。其他采药、犬患、找簪、抓贼与送饭委托都可选。</p><p class="muted" style="margin-top:12px">从官道进平安城，问英雄坛执事。想跳过拜师，可升至四级挑战使者，取试炼令兑换英雄帖。</p></div><div class="card"><h3>武学与交锋</h3><div class="divider"></div><p class="muted">外功、内功、轻功各有一个激活槽。所学武功永久保留；刀剑拳杖各需对应兵器，长拳通用。内功影响生存，轻功影响先手、闪避、逃跑。</p><p class="muted" style="margin-top:12px">每回合根据身法先后出招。敌方“蓄势重击”时可防御；毒伤会逐回合生效，用解毒散或岐黄术解除。自动模式只用普攻，不会替你选择药物或武功。</p></div><div class="card"><h3>帖、榜与结局</h3><div class="divider"></div><p class="muted">五种信物来源：门派贡献六十、官府缉匪、成功押镖两次、山寨救人、使者试炼。先在平安城换真帖，再让坛前守卫验证、执事登记。</p><p class="muted" style="margin-top:12px">榜单从第二十名到第一名，挑战逐级开放。失败不掉排名、不丢关键物。登顶后依据独立状态生成结局候选，最终只能选择一个。</p></div></div><div class="note" style="margin-top:18px">顶部菜单平时收起，鼠标移到屏幕上沿展开；触屏可点“江湖”。小地图默认为近景，可切换全景，方向与场景一致，点击可导航。人物志提示五秒后渐隐，按 L 或点小地图下方入口查阅。听风楼每四小时游戏时间更新可选委托，按 T 查看；等待、行走与休息都会推进时辰。</div><div class="note" style="margin-top:12px">NPC 对话标明“主线保护”“可结交 / 死斗”或“定时重生”。击杀普通人物会永久失去其服务；善恶、通缉、杀气及商价影响显示于左上。缴罚银只清通缉，赈济可缓解杀气，两者不能互相替代。</div><div class="note" style="margin-top:18px">三级科举：按 U 查看，正式考试须亲赴考官。每级120题，温习免费，错题连续答对两次后移出待复习。卷内1–4选择、Enter确认/下一题，Esc仅收起而不弃卷；可导出带有未完试卷的存档。主线不要求参加科举。<br><br>保管存档：浏览器清理站点数据会清空本地记录。文件地址与网站地址属于不同存储环境；跨设备使用导出 / 导入 JSON。无联网服务，存档不会自动上传。</div>`, '操作 · 成长 · 终局', 'large');

                    try {

                    catch {
                    }
                    if(['sound','footsteps','volume'].includes(k)){this.audio.apply();if(this.settings.sound)this.audio.unlock();if(k==='volume')$('#volume-value').textContent=Math.round(this.settings.volume*100)+'%';}

            window.addEventListener('keydown', e => {

                if (e.code === 'Escape') {

                    if (this.modal)
                        this.closeModal();
                    else
                        this.showSettings();
                    return;
                }
                if (this.modal) {
                    if(!typing&&this.academy.key(e))return;
                    if (e.code === 'Tab') {
                        const nodes = $$('#modal-root button:not([disabled]),#modal-root input,#modal-root select,#modal-root [tabindex="0"]'), first = nodes[0], last = nodes[nodes.length - 1];
                        if (e.shiftKey && document.activeElement === first) {
                            last?.focus();
                            e.preventDefault();
                        }
                        else if (!e.shiftKey && document.activeElement === last) {
                            first?.focus();
                            e.preventDefault();
                        }
                    }
                    if (e.code === 'Enter' && document.activeElement?.tagName.toLowerCase() === 'g')
                        this.act(document.activeElement.dataset.act, document.activeElement.dataset.arg);
                    return;
                }
                if (typing || !this.s)
                    return;

            };
            joy.addEventListener('pointerdown', e => {

                this.world.joy = { x: 0, y: 0 };
                $('#stick').style.transform = '';
            };
            joy.addEventListener('pointerup', end);
            joy.addEventListener('pointercancel', end);
            $('#minimap').addEventListener('click',e=>this.world.miniClick(e));
        }

        refreshIntel(force=false) {

            let changed=false;
            for(const q of intel.offers)if(['offered','active'].includes(q.status)&&time>=q.deadline){
                q.status='expired';intel.archive.unshift({...q,closedAt:time});changed=true;
                if(this.s.tracked==='intel:'+q.id)this.s.tracked='main';
                if(q.accepted!==null)this.log('听风','“'+q.title+'”已经过期，未扣除资源或名声。');
            }
            intel.offers=intel.offers.filter(q=>q.status!=='expired');
            if(cycle!==intel.cycle||force&&intel.cycle<0){
                intel.cycle=cycle;
                const rnd=rng(parseInt(hash(this.s.id+'_'+cycle),16));
                const list=C.intelTemplates.filter(t=>t.level<=this.s.player.level+1&&!this.travelLock(t.map)&&!intel.offers.some(q=>q.template===t.key));
                list.sort((a,b)=>parseInt(hash(a.key+'_'+cycle),16)-parseInt(hash(b.key+'_'+cycle),16));
                let free=Math.max(0,4-intel.offers.filter(q=>q.status==='offered').length);
                for(const t of list.slice(0,Math.min(3,free))){
                    const m=C.maps[t.map],x=m.width*(.32+rnd()*.30)*(m.biome==='harbor'?.8:1),y=m.height*(.47+rnd()*.23);
                    intel.offers.push({id:'wind_'+(++intel.serial),template:t.key,title:t.title,map:t.map,x:Math.round(x),y:Math.round(y),type:t.type,posted:time,deadline:time+t.duration,status:'offered',accepted:null,progress:0,variant:rnd()<.5?0:1,examined:false});
                    changed=true;

/* ===== Cultivation, progression, crafting, social bonds and closed quest loops ===== */
class XSystem {
 constructor(g){this.g=g;this.tab='dao';this.art='alchemy';this.battleRate=1;this.recordFilter='';this.lastResult=null;this.encounterContext=null;}
 fresh(root='wood',seed='归鸿'){
  if(!XE[root])root='wood';

  const second={metal:'frost_stream',wood:'ember_talisman',water:'vine_seal',fire:'stone_spike',earth:'golden_arc'};
  return {version:1,seed:String(seed||'归鸿').slice(0,32),root,realm:0,cultivation:0,spirit:45,
   learned:{[first[root]]:{rank:1,xp:0,branch:null},[second[root]]:{rank:1,xp:0,branch:null}},
   slots:[first[root],second[root],null,null],knownPassives:['breath_of_origin'],passives:['breath_of_origin'],knownMoves:['leaf_step'],movement:'leaf_step',
   artifact:{unlocked:false,level:1,xp:0,route:'spirit_guard',element:root},arts:{alchemy:0,forging:0,talisman:0,array:0},
   meridians:{ren:0,du:0,chong:0,dai:0,yin:0,yang:0},enchants:{},
   quests:Array.from({length:9},()=>({accepted:false,trace:false,puzzle:false,boss:false,done:false,choice:null})),
   puzzle:{},gathered:{},caches:{},encounters:{},companions:[],companion:null,pets:{},pet:null,
   home:{level:0,garden:[],rested:0},codex:{reactions:[],enemies:{}},mercy:0,power:0,
   records:[],achievements:[],prepared:null,thunderReady:false,rift:{floor:1,best:0,wins:0},ending:null,
   stats:{reactions:0,gathered:0,crafted:0,breakthroughs:0,artifactUses:0,perfectDodges:0,battles:0,plants:0},lastPillDay:0,pillsToday:0,track:true};
 }
 state(){return this.g.s?.xian;}
 ensure(s=this.g.s){
  if(!s)return;
  if(!s.xian)s.xian=this.fresh();
  const x=s.xian;
  x.records=x.records||[];x.track=x.track!==false;
  x.slots=x.slots.slice(0,4);while(x.slots.length<4)x.slots.push(null);
  return x;
 }
 need(r=this.state()?.realm||0){return XDATA.chapters[r].need;}
 spirit(n){const x=this.state();x.spirit=Math.max(0,Math.min(1e9,Math.round(x.spirit+n)));}
 record(type,text){const x=this.state();if(!x)return;x.records.push({time:this.g.s.time,type,text:String(text).slice(0,400)});if(x.records.length>220)x.records.shift();}
 gain(amount){const x=this.state();if(!x||!Number.isFinite(amount)||amount<=0)return;const mul=XDIFF_OF(this.g.s.difficulty).cult;x.cultivation=Math.min(this.need()*3,x.cultivation+Math.round(amount*mul));}
 artLevel(id){return Math.min(5,Math.floor((this.state().arts[id]||0)/60));}
 requireCost(cost,sp=0){
  if(this.state().spirit<sp)return '灵石不足，还需 '+Math.ceil(sp-this.state().spirit)+' 枚。';
  const missing=Object.entries(cost).filter(([id,n])=>(this.g.s.inventory[id]||0)<n);
  return missing.length?'缺少 '+missing.map(([id,n])=>I(id).name+' ×'+(n-(this.g.s.inventory[id]||0))).join('、'):'';
 }
 pay(cost,sp=0){const err=this.requireCost(cost,sp);if(err){this.g.toast(err,'bad');return false;}for(const [id,n]of Object.entries(cost))this.g.removeItem(id,n);this.spirit(-sp);return true;}
 after(tab=this.tab){this.g.after();if(tab)this.open(tab);}
 objective(){
  const x=this.state(),r=x.realm,q=x.quests[r],c=XDATA.chapters[r];

 }

 }
 page_dao(){

 }
 guide(){
  const x=this.state(),o=this.objective();

   if(o.action==='accept')return this.accept(x.realm);
   if(o.action==='trial')return this.trial();
   if(o.action==='ending')return this.open('ending');
   if(o.action==='craft'){this.art='alchemy';return this.open('craft');}
   return this.open('home');

  this.g.guideToMap(o.map,null,uid);
 }

 }
 choose(r,choiceId){

  q.trace=true;q.choice=choiceId;x[choiceId]++;this.g.s.player.moral+=choiceId==='mercy'?4:0;

 altar(r){

 altarPress(r,el){

   hp:v.health,atk:v.attack,defense:v.defense,spd:v.speed,xp:boss?140+r*150:0,gold:boss?50+r*40:0,
   weapon:r%2?'staff':'sword',element:c.element,loot:boss?[[`x_relic_${r}`,1],['raw_jade',1]]:[],boss:true,bossIndex:r,phases:boss?c.phases:null,
   behavior:boss?c.behavior:null,ai:boss?(BOSS_AI[c.behavior]||'caster'):'caster'};
 }
 boss(r){

 trial(){

 }
 settle(b,won,fled){
  const x=this.state(),r=b.context.bossIndex;
  x.stats.battles++;x.stats.perfectDodges+=b.perfectDodges;x.stats.reactions+=b.reactions;
  if(won){
   const gain=Math.round(8+b.enemies.reduce((n,e)=>n+(e.xp||0),0)*.08);this.spirit(gain);
   x.artifact.xp+=12+b.enemies.length*4+(b.context.type==='xBoss'?30:0);
   if(b.context.type==='xBoss'&&r===x.realm&&!x.quests[r].boss){
    x.quests[r].boss=true;this.gain(this.need()*.38);this.spirit(25+r*20);
    const reward=XDATA.bosses[r].rewardTechnique;
    if(XS[reward]&&!x.learned[reward]){x.learned[reward]={rank:2,xp:0,branch:null};const slot=x.slots.indexOf(null);if(slot>=0)x.slots[slot]=reward;}
    this.record('守关','战胜'+XDATA.bosses[r].name+'（'+XDATA.bosses[r].title+'），'+XR[r]+'境因果得以了结。');
    this.lastResult='守关诏书已完成，获得修为 '+Math.round(this.need()*.38)+'。';
   }
   if(b.context.type==='xTrial'&&b.context.realm===x.realm&&!x.quests[x.realm].done){
    const old=x.realm;this.g.removeItem('clear_vein_pill',1);x.cultivation=Math.max(0,x.cultivation-this.need());x.quests[old].done=true;x.realm++;
    x.stats.breakthroughs++;this.spirit(40+x.realm*25);this.g.s.player.potential+=30+x.realm*8;
    this.record('破境',XR[old]+' → '+XR[x.realm]+'。九霄雷歇，另一重山河从此可见。');
    this.g.s.player.hp=this.g.stats().maxHp;this.g.s.player.mp=this.g.stats().maxMp;this.g.s.status={};
    this.lastResult='突破成功：'+XR[x.realm]+'。新区域、术法与成长上限已开放。';
   }
   if(b.context.type==='xRift'){
    const floor=b.context.floor;x.rift.best=Math.max(x.rift.best,floor);x.rift.wins++;x.rift.floor=floor+1;
    this.spirit(10+floor*6);this.gain(15+floor*12);this.g.addItem('essence_'+XEL[(floor-1)%5],1+Math.floor(floor/5));
    if(floor%5===0)this.g.addItem('jade_temper_token',2);
    this.record('奇境','通过第 '+floor+' 层，战利品已收入行囊。');
    this.lastResult='第 '+floor+' 层结算完毕；可以继续下一层或回到山河。';
   }
  }else {
   if(b.context.type==='xRift'){this.lastResult='本次奇境止步。已经结算的战利品不会被追回。';x.rift.floor=1;}
   if(b.context.type==='xTrial')this.lastResult='破境未成，清脉丹与修为完整保留。养息后可再试。';
  }
  if(b.context.type==='xTrial')x.thunderReady=false;
  this.record(won?'胜负':fled?'退避':'胜负',(won?'战胜':fled?'抽身离开':'败于')+b.enemies.map(e=>e.name).join('、')+'，历时 '+b.time.toFixed(1)+' 秒。');
 }
 rift(){

  base.id='x_rift_'+floor;base.name=XE[XEL[(floor-1)%5]].name+'行界灵 · '+floor+'层';base.element=XEL[(floor-1)%5];base.bossIndex=-1;base.phases=null;

 craft(id){
  const r=XRECIPES.find(r=>r.id===id),x=this.state();if(!r||this.artLevel(r.art)<r.level)return;
  if(!this.pay(r.cost,r.sp))return;

/* Frame ownership: exactly one simulation update per animation frame. */
const worldTick=World.prototype.tick;
World.prototype.tick=function(dt){
 this.g.audio.musicTick?.();
 if(this.g.battle){this.age+=dt;this.g.battle.tick(dt);return;}
 return worldTick.call(this,dt);
};
const worldPointer=World.prototype.pointer;
World.prototype.pointer=function(e){if(this.g.battle)return this.g.battle.pointer(e);return worldPointer.call(this,e);};
const worldAvailable=World.prototype.availableObject;
World.prototype.availableObject=function(a){
 const x=this.g.s?.xian;if(x&&a.sub==='xGather')return x.gathered[a.uid]===undefined||this.g.s.time-x.gathered[a.uid]>=180;
 if(x&&a.sub==='xCache')return !x.caches[a.uid];
 return worldAvailable.call(this,a);
};

/* Modal-safe keyboard capture: legacy turn commands never receive battle keys. */
window.addEventListener('keydown',e=>{
 const g=window.Hero;if(!g)return;
 const typing=/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName);
 if(typing)return;
 const b=g.battle;
 if(b){
  const keys=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if(keys.includes(e.code)){e.preventDefault();e.stopImmediatePropagation();if(!b.paused)b.keys[e.code]=true;return;}
  const command={Space:['pause'],Escape:['pause'],Tab:['target'],Digit1:['skill',g.s.xian.slots[0]],Digit2:['skill',g.s.xian.slots[1]],Digit3:['skill',g.s.xian.slots[2]],Digit4:['skill',g.s.xian.slots[3]],Digit5:['martial'],KeyQ:['guard'],ShiftLeft:['dash'],ShiftRight:['dash'],KeyR:['artifact'],KeyE:['items'],KeyK:['skills'],KeyF:['flee']};
  if(command[e.code]){
   e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;
   const [a,id]=command[e.code];if(a==='pause')b.togglePause();else if(a==='target'){let i=b.target;do{i=(i+1)%b.enemies.length;}while(b.enemies[i].hp<=0&&i!==b.target);b.target=i;b.render();}else b.choose(a,id||'');
  }
  return;
 }
 if(e.code==='KeyO'&&g.s&&!e.repeat){e.preventDefault();e.stopImmediatePropagation();g.x.open('dao');}
},true);
window.addEventListener('keyup',e=>{if(window.Hero?.battle)delete window.Hero.battle.keys[e.code];},true);
window.addEventListener('blur',()=>{window.Hero?.battle?.setPause('已离开窗口 · 为你暂停');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.Hero?.battle?.setPause('页面不可见 · 为你暂停');});
document.addEventListener('keydown',e=>{if(['Enter','Space'].includes(e.code)&&e.target.matches?.('svg [data-act]')){e.preventDefault();window.Hero?.act(e.target.dataset.act,e.target.dataset.arg);}});

/* Deterministic local pentatonic soundtrack; no downloaded samples. */
C.audio.maxVoices=Math.max(64,C.audio.maxVoices);
for(const [name,voices]of Object.entries({
 cast:[{wave:'sine',freq:440,end:880,gain:.17,duration:.28},{wave:'triangle',freq:660,end:1100,gain:.08,duration:.35,delay:.04}],
 fire:[{wave:'noise',freq:700,end:130,gain:.2,duration:.4}],
 water:[{wave:'sine',freq:1046,end:392,gain:.15,duration:.4}],
 dash:[{wave:'noise',freq:1800,end:500,gain:.12,duration:.15}],
 ultimate:[{wave:'triangle',freq:130,end:260,gain:.18,duration:.9},{wave:'sine',freq:523,end:1046,gain:.18,duration:.9,delay:.06}],
 break:[{wave:'noise',freq:1600,end:250,gain:.19,duration:.3},{wave:'sine',freq:196,end:98,gain:.17,duration:.28}]
}))C.audio.presets[name]={cooldown:.09,voices};
SynthAudio.prototype.musicTick=function(){
 if(!this.ctx||this.ctx.state!=='running'||!this.g.settings.sound||!this.g.settings.music||document.hidden)return;
 const ctx=this.ctx,t=ctx.currentTime,battle=!!this.g.battle;
 if((this.musicNext||0)>t+.12)return;
 this.musicNext=t+(battle?.36:.78);this.musicNote=(this.musicNote||0)+1;
 const seq=battle?[0,2,4,2,3,1,2,4,0,2,3,4,2,1,4,3]:[0,2,3,2,1,0,4,3,2,4,3,1,2,0,1,4,2,3,4,2,0,1,2,0];
 const scale=[261.63,293.66,329.63,392,440],freq=scale[seq[this.musicNote%seq.length]]*(battle?1:.5);
 try{
  this.makeVoice(ctx,this.master,{wave:'sine',freq,gain:.075,duration:battle?.55:1.7},t+.025,true);
  this.makeVoice(ctx,this.master,{wave:'sine',freq:freq*2,gain:.035,duration:.6},t+.025,true);
  if(this.musicNote%4===0)this.makeVoice(ctx,this.master,{wave:'triangle',freq:130.81,gain:.035,duration:2.6},t+.02,true);
  if(battle&&this.musicNote%2===0)this.makeVoice(ctx,this.master,{wave:'sine',freq:95,end:42,gain:.10,duration:.16},t+.025,true);
 }catch{}
};
